name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Python PDF dependency
        run: python -m pip install reportlab

      - name: Generate current CV PDF
        run: python scripts/build_cv.py

      - name: Assemble supplied Deadpool image
        run: |
          cat public/assets/deadpool-sleeping.webp.b64.part1 public/assets/deadpool-sleeping.webp.b64.part2 public/assets/deadpool-sleeping.webp.b64.part3 public/assets/deadpool-sleeping.webp.b64.part4 | base64 -d > public/assets/deadpool-sleeping.webp

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
